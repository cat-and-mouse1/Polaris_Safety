plugins {
    id 'com.android.application' version '9.3.0'
}

android {
    namespace 'com.polaris.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.polaris.app'
        minSdk 24
        targetSdk 37
        versionCode 3
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.work:work-runtime:2.10.1'

    // Shizuku: run privileged commands with ADB/root identity (Android 6.0+)
    // 12.2.0 is the last release with a public Shizuku.newProcess(...) API;
    // 13.x made it private (use bindUserService / AIDL instead).
    def shizuku_version = '12.2.0'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
}
