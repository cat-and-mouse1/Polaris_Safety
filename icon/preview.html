<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Polaris Icon Preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #f4f4f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  .card {
    background: #ffffff;
    padding: 64px 72px;
    border-radius: 28px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.08);
    text-align: center;
  }
  .icon {
    width: 480px;
    height: 480px;
    display: block;
    margin: 0 auto;
  }
  .name {
    margin-top: 28px;
    font-size: 24px;
    font-weight: 500;
    color: #111;
    letter-spacing: 0.08em;
  }
  .sub {
    margin-top: 8px;
    font-size: 14px;
    color: #888;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <path d="M100,12 C100,76 124,100 188,100 C124,100 100,124 100,188 C100,124 76,100 12,100 C76,100 100,76 100,12 Z"
            fill="none"
            stroke="#000000"
            stroke-width="9"
            stroke-linejoin="round"
            stroke-linecap="round"/>
    </svg>
    <div class="name">POLARIS</div>
    <div class="sub">four-pointed star · black outline</div>
  </div>
</body>
</html>
